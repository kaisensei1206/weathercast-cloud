# CI：每個 PR 和每次合併到 main 都會跑後端測試、Terraform 檢查和前端測試。
# CD：只有 main 上、而且 CI 通過，才會用 OIDC 登入 AWS，把新版程式碼部署到已經存在的 Lambda，
#     再把前端上傳到已經存在的 S3 bucket，並清除 CloudFront 快取。
# 說明見 docs/cicd.md。
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # 在 GitHub 上手動重新部署 main（例如部署失敗修好權限之後）

# 預設沒有任何權限；需要的 job 自己再開
permissions: {}

env:
  AWS_REGION: ap-northeast-1
  TERRAFORM_VERSION: 1.16.5
  PYTHON_VERSION: "3.12"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        run: pytest --cov

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform

      # -backend=false：只下載 provider 做語法檢查，不連 AWS，也不需要憑證
      - name: Terraform validate
        run: |
          for stack in bootstrap main; do
            terraform -chdir=terraform/$stack init -backend=false -input=false
            terraform -chdir=terraform/$stack validate
          done

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci 完全照 package-lock.json 安裝，每次都是同一組版本
      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      # 不設定 VITE_API_BASE_URL：前端用相對路徑 /api，由 CloudFront 轉給 API Gateway
      - name: Build
        run: npm run build

      # 部署用的檔案在這個沒有 AWS 權限的 job 建好，deploy job 只下載結果，
      # 不在拿到 AWS 憑證之後執行 npm 套件的程式碼
      - name: Upload build for deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: [test, frontend] # 任何一個失敗就不會執行
    # PR 永遠不部署；只有 main 的 push 或手動觸發才部署
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # 向 GitHub 申請 OIDC token，換取 AWS 臨時憑證
    # 同一時間只跑一個部署；後來的會排隊，不會中斷正在進行的 apply
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    defaults:
      run:
        working-directory: terraform/main
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false # 讓 terraform output -raw 只輸出值本身

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # 打包 backend/src 並和線上版本比較
      - name: Terraform plan
        run: terraform plan -input=false -out=main.tfplan

      # 部署角色只能更新 Lambda；plan 若改到其他資源就停下來，由人在本機處理
      - name: Check plan only updates Lambda
        run: |
          terraform show -json main.tfplan > plan.json
          python ../../scripts/check_plan.py plan.json

      - name: Terraform apply
        run: terraform apply -input=false main.tfplan

      # 先讀出 output，後面的步驟都在 frontend 目錄執行
      - name: Read Terraform outputs
        id: tf
        run: |
          echo "api_base_url=$(terraform output -raw api_base_url)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(terraform output -raw frontend_url)" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$(terraform output -raw frontend_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

      # frontend job 建好的檔案；這個 job 有 AWS 憑證，所以不在這裡執行 npm
      - name: Download frontend build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist

      # 先傳 assets 再傳 index.html：使用者不會拿到「指向還沒上傳的檔案」的首頁。
      # assets 的檔名含內容 hash，內容一變檔名就變，所以可以永久快取；
      # index.html 等其他檔案設成 no-cache，每次都向 CloudFront 確認有沒有新版。
      - name: Upload frontend to S3
        working-directory: frontend
        env:
          BUCKET: ${{ steps.tf.outputs.frontend_bucket }}
        run: |
          aws s3 sync dist/assets "s3://$BUCKET/assets" --delete --cache-control "public,max-age=31536000,immutable"
          aws s3 sync dist "s3://$BUCKET" --delete --exclude "assets/*" --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ steps.tf.outputs.distribution_id }}"
          --paths "/" "/index.html"

      # 直接打 API Gateway，也透過 CloudFront 打一次，確認首頁和 /api/* 轉發都正常
      - name: Smoke test
        run: |
          python ../../scripts/smoke_test.py "${{ steps.tf.outputs.api_base_url }}"
          python ../../scripts/smoke_test.py "${{ steps.tf.outputs.frontend_url }}" --frontend
