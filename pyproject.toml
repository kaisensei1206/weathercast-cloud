[project]
name = "weathercast-cloud"
version = "0.1.0"
description = "查詢台灣 22 縣市天氣的 Serverless API（AWS Lambda + API Gateway + DynamoDB）"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 讓測試直接 import backend/src 底下的模組（和 Lambda 執行時的匯入路徑一致）、tests/fakes.py，
# 以及 scripts/ 底下 CI/CD 用的腳本
pythonpath = ["backend/src", "tests", "scripts"]
filterwarnings = [
    # botocore 內部使用已棄用的 datetime.utcnow()，不是本專案的問題，等 botocore 更新
    "ignore:datetime.datetime.utcnow:DeprecationWarning:botocore",
]

[tool.ruff]
target-version = "py312"
line-length = 100
# 讓 import 排序知道 backend/src、tests、scripts 底下的模組是本專案自己的
src = ["backend/src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["backend/src"]
branch = true

[tool.coverage.report]
show_missing = true
